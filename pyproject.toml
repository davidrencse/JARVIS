[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "David's personal workflow OS"
requires-python = ">=3.10"
# onnxruntime/tokenizers/huggingface_hub: semantic memory and the decider (embed.py);
# psutil: agent_browser's session check (Windows has no /proc fallback).
dependencies = ["Pillow>=12.3.0", "onnxruntime>=1.23", "tokenizers>=0.23,<0.24",
                "huggingface_hub>=2.3,<3", "psutil>=5.9"]

[project.optional-dependencies]
# Pinned to the set running on the Arch main (.venv, Python 3.14). numpy stays a range:
# its newest wheels drop older Pythons (uv.lock resolves 2.2.6 on 3.10).
voice = ["numpy>=2.2", "sounddevice==0.5.6", "faster-whisper==1.2.1", "sherpa-onnx==2.0.1",
         "kokoro-onnx==0.6.1", "onnx-asr==0.12.0"]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-node = "jarvis.node:main"

[tool.setuptools]
packages = ["jarvis"]

[tool.setuptools.package-data]
jarvis = ["web/*", "web/fonts/*"]
